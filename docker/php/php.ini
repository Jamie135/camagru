; ---------------------------------------------------------------------------
; Error handling
;
; Nothing is ever written into the response body; every
; diagnostic goes to the log instead.
; ---------------------------------------------------------------------------

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

; ---------------------------------------------------------------------------
; Sessions
;
; Cookie flags are set in code, in app/core/Session.php.
; ---------------------------------------------------------------------------

; Refuse session ids PHP did not generate itself.
session.use_strict_mode = 1

; The id travels in a cookie only.
session.use_only_cookies = 1
