services:
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - ./data/uploads:/var/www/data/uploads:ro
    depends_on:
      - php
  
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@camagru.local}
      APP_URL: ${APP_URL}
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT}:8025"
  
  # Browser UI for the database. Dev-only, so it sits behind a profile and
  # stays out of the default stack: docker compose --profile dev up -d
  adminer:
    profiles: ["dev"]
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
  
volumes:
  db_data:
